const originalPageNumberOld=i=>{i=i>=19?i+2:i;i=i>=18?i+3:i;const prev=i>=20?i+1:i;const old=prev>=25?prev+1:prev;return old===6?'new06':old>=30?old:old>=7?old-1:old};
const pageKey=i=>PAGE_STORE+(i===5?'05_revised':String(originalPageNumber(i)).padStart(2,'0'));

const MCS_SHARED_KEY='mcs_hvrp_cross_page_fields_v1';
function readShared(){try{return JSON.parse(localStorage.getItem(MCS_SHARED_KEY)||'{}')}catch(e){return {}}}
function sharedValue(el,shared){
 const key=el.dataset.mcsShared;if(!key)return '';
 if(shared[key])return shared[key];
 if(key==='fullName' && (shared.firstName||shared.lastName))return [shared.lastName,shared.firstName].filter(Boolean).join(', ');
 if(key==='firstName'&&shared.fullName)return shared.fullName.includes(',')?shared.fullName.split(',').slice(1).join(',').trim():shared.fullName.trim().split(/\s+/)[0];
 if(key==='lastName'&&shared.fullName)return shared.fullName.includes(',')?shared.fullName.split(',')[0].trim():shared.fullName.trim().split(/\s+/).slice(1).join(' ');
 return '';
}
function applyShared(doc){
 const shared=readShared();
 doc.querySelectorAll('[data-mcs-shared]').forEach(el=>{
  const v=sharedValue(el,shared);
  if(v && !el.value){el.value=v;el.dispatchEvent(new Event('change',{bubbles:false}))}
 });
}
function captureShared(doc){
 const shared=readShared();let changed=false;
 doc.querySelectorAll('[data-mcs-shared]').forEach(el=>{
  const key=el.dataset.mcsShared,v=el.value.trim();
  if(v && shared[key]!==v){shared[key]=v;changed=true}
 });
 if(changed)try{localStorage.setItem(MCS_SHARED_KEY,JSON.stringify(shared))}catch(e){}
}
function cleanFalseBlankFields(doc){
 doc.querySelectorAll('input:not([type=checkbox]):not([type=radio]),textarea').forEach(el=>{
  if((el.value||'').trim().toLowerCase()==='false')el.value='';
 });
}
// Keep descriptive response boxes wrapped and tall enough to show every typed line.
function fitLongAnswers(doc){
 doc.querySelectorAll('textarea').forEach(el=>{
  el.setAttribute('wrap','soft');
  el.style.whiteSpace='pre-wrap';
  el.style.overflowWrap='break-word';
  el.style.wordBreak='break-word';
  el.style.overflowY='hidden';
  el.style.resize='none';
  const grow=()=>{
   const minHeight=parseFloat(el.dataset.mcsMinHeight)||(el.getBoundingClientRect().height||40);
   el.dataset.mcsMinHeight=String(minHeight);
   el.style.height='auto';
   el.style.height=Math.max(minHeight,el.scrollHeight+2)+'px';
  };
  if(!el.dataset.mcsAutoGrow){
   el.dataset.mcsAutoGrow='1';
   el.addEventListener('input',()=>{grow();if(doc===frame.contentDocument)sizeFrame()});
  }
  grow();
 });
}
function enableCalendars(doc){
 doc.querySelectorAll('input[data-mcs-date],input[type=date]').forEach(el=>{
  if(el.type!=='date')return;
  el.style.minHeight='30px';
  el.style.cursor='pointer';
  el.addEventListener('click',()=>{try{if(el.showPicker)el.showPicker()}catch(e){}});
 });
}

let restoring=false;
function saveCurrentPage(){
  try{
    const doc=frame.contentDocument;
    if(!doc||!doc.body||restoring)return;
    const fields=[...doc.querySelectorAll('input,textarea,select')].filter(e=>e.type!=='button'&&e.type!=='submit');
    const data={};fields.forEach((el,j)=>{data[j]=(el.type==='checkbox'||el.type==='radio')?el.checked:el.value});
    const canvases={};doc.querySelectorAll('canvas').forEach((c,j)=>{
      try{
        if(c.width&&c.height){
          const pixels=c.getContext('2d').getImageData(0,0,c.width,c.height).data;
          let marked=false;
          for(let k=3;k<pixels.length;k+=4){if(pixels[k]>0){marked=true;break}}
          if(marked)canvases[j]=c.toDataURL('image/png');
        }
      }catch(e){}
    });
    localStorage.setItem(pageKey(n),JSON.stringify(data));
    captureShared(doc);
    // Signature canvases can be large; store separately so text answers always save.
    try{
      const key='mcs_hvrp_canvas_v1_'+originalPageNumber(n);
      const previous=JSON.parse(localStorage.getItem(key)||'{}');
      localStorage.setItem(key,JSON.stringify({...previous,...canvases}));
    }catch(e){}
  }catch(e){console.warn('Could not save page:',e)}
}
function restoreCurrentPage(){
  const doc=frame.contentDocument;if(!doc||!doc.body)return;
  restoring=true;
  try{
    const data=JSON.parse(localStorage.getItem(pageKey(n))||'{}');
    if(n===23){
      try{
        const prior=JSON.parse(localStorage.getItem('mcs_hvrp_page_answers_v3_24')||'{}');
        const oldCount=doc.querySelectorAll('main.paper table:not(:last-of-type) input, main.paper textarea, main.paper select').length;
        // Use exact field count from original page 24, before the appended table.
        const added=doc.querySelector('main.paper table:last-of-type');
        if(added){const all=[...doc.querySelectorAll('input,textarea,select')].filter(e=>e.type!=='button'&&e.type!=='submit');const first=all.indexOf(added.querySelector('input'));if(first>=0)Object.keys(prior).forEach(k=>{const index=first+Number(k);if(Number.isInteger(index)&&index<all.length&&!Object.prototype.hasOwnProperty.call(data,index))data[index]=prior[k]})}
      }catch(e){}
    }
    const fields=[...doc.querySelectorAll('input,textarea,select')].filter(e=>e.type!=='button'&&e.type!=='submit');
    fields.forEach((el,j)=>{if(Object.prototype.hasOwnProperty.call(data,j)){
      if(el.type==='checkbox'||el.type==='radio')el.checked=(data[j]===true||data[j]==='true');else if(data[j]!==false&&data[j]!==true&&data[j]!==null&&data[j]!==undefined&&String(data[j]).toLowerCase()!=='false'&&String(data[j]).toLowerCase()!=='true')el.value=data[j];
    }});
    const canvases=JSON.parse(localStorage.getItem('mcs_hvrp_canvas_v1_'+originalPageNumber(n))||'{}');
    doc.querySelectorAll('canvas').forEach((c,j)=>{if(canvases[j]){
      const im=new Image();im.onload=()=>{try{c.getContext('2d').drawImage(im,0,0,c.width,c.height)}catch(e){}};im.src=canvases[j];
    }});
  }catch(e){console.warn('Could not restore page:',e)}
  finally{restoring=false}
}
frame.addEventListener('load',()=>{
  restoreCurrentPage();applyShared(frame.contentDocument);cleanFalseBlankFields(frame.contentDocument);enableCalendars(frame.contentDocument);fitLongAnswers(frame.contentDocument);sizeFrame();setTimeout(sizeFrame,250);
  const doc=frame.contentDocument;
  if(doc){doc.addEventListener('input',saveCurrentPage,true);doc.addEventListener('change',saveCurrentPage,true);
    doc.addEventListener('pointerup',()=>setTimeout(saveCurrentPage,0),true);
    doc.addEventListener('touchend',()=>setTimeout(saveCurrentPage,0),true);
    doc.querySelectorAll('canvas').forEach((canvas,j)=>{
      canvas.addEventListener('pointerup',()=>setTimeout(saveCurrentPage,40));
      canvas.addEventListener('pointercancel',()=>setTimeout(saveCurrentPage,40));
      const clearButton=canvas.parentElement?.querySelector('button');
      if(clearButton && /clear/i.test(clearButton.textContent||'')){
        clearButton.addEventListener('click',()=>{
          setTimeout(()=>{
            try{
              const key='mcs_hvrp_canvas_v1_'+originalPageNumber(n);
              const saved=JSON.parse(localStorage.getItem(key)||'{}');
              delete saved[j];
              localStorage.setItem(key,JSON.stringify(saved));
            }catch(e){}
          },50);
        });
      }
    });
  }
});
window.addEventListener('pagehide',saveCurrentPage);

window.addEventListener('resize',sizeFrame);
for(let i=1;i<=29;i++){let o=document.createElement('option');o.value=i;o.textContent='Page '+i+' of 29';sel.append(o)}
function go(v){if(frame.contentDocument&&frame.contentDocument.body&&frame.contentDocument.body.children.length)saveCurrentPage();n=Math.max(1,Math.min(29,Number(v)));sel.value=n;frame.srcdoc=pageHTML(n);window.scrollTo(0,0);document.getElementById('prev').disabled=n===1;document.getElementById('next').disabled=n===29}
sel.onchange=()=>go(sel.value);document.getElementById('prev').onclick=()=>go(n-1);document.getElementById('next').onclick=()=>go(n+1);go(1);

const KEY='mcs_hvrp_page_answers_v3_';
function persistVisible(){saveCurrentPage();try{frame.contentWindow.dispatchEvent(new Event('pagehide'))}catch(e){}}
document.getElementById('save').onclick=()=>{persistVisible();alert('Progress saved on this device and browser. It is not uploaded to MCS. Do not clear browser data or use private browsing if you need to return.');};
// Dedicated PDF generation: one explicitly created PDF page for each intake page.
// The form is rendered locally in the browser; no participant data is uploaded.
const pdfButton=document.getElementById('print');
// Try independent providers: some mobile networks block a particular CDN.
function loadPdfLibrary(urls,test){
 return new Promise((resolve,reject)=>{
  if(test())return resolve();
  let index=0;
  function next(){
   if(test())return resolve();
   if(index>=urls.length)return reject(new Error('All PDF library sources failed to load. Check Safari content blockers or try a different network.'));
   const url=urls[index++];
   const script=document.createElement('script');
   script.src=url;script.async=true;
   const timeout=setTimeout(()=>{script.onload=null;script.onerror=null;script.remove();next()},12000);
   script.onload=()=>{clearTimeout(timeout);if(test())resolve();else next()};
   script.onerror=()=>{clearTimeout(timeout);script.remove();next()};
   document.head.appendChild(script);
  }
  next();
 });
}
async function pdfExport(){
 persistVisible();
 pdfButton.disabled=true;pdfButton.textContent='Creating PDF (0 of 29)…';
 let renderFrame=null;
 try{
  await loadPdfLibrary(['https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js','https://unpkg.com/html2canvas@1.4.1/dist/html2canvas.min.js','https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js'],()=>typeof window.html2canvas==='function');
  await loadPdfLibrary(['https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js','https://unpkg.com/jspdf@2.5.2/dist/jspdf.umd.min.js','https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.2/jspdf.umd.min.js'],()=>!!window.jspdf?.jsPDF);
  const pdf=new window.jspdf.jsPDF({orientation:'portrait',unit:'pt',format:'letter',compress:true});
  renderFrame=document.createElement('iframe');
  renderFrame.setAttribute('aria-hidden','true');
  renderFrame.style.cssText='position:fixed;left:-12000px;top:0;width:1000px;height:1600px;border:0;visibility:visible;pointer-events:none;';
  document.body.appendChild(renderFrame);
  for(let i=1;i<=29;i++){
   pdfButton.textContent=`Creating PDF (${i} of 29)…`;
   const doc=await new Promise((resolve,reject)=>{
    const timeout=setTimeout(()=>reject(new Error('Page '+i+' took too long to render')),20000);
    renderFrame.onload=()=>{clearTimeout(timeout);resolve(renderFrame.contentDocument)};
    renderFrame.srcdoc=pageHTML(i);
   });
   // Restore the saved answers for this specific page before taking its image.
   let answers={};try{answers=JSON.parse(localStorage.getItem(pageKey(i))||'{}')}catch(e){}
   const fields=[...doc.querySelectorAll('input,textarea,select')].filter(e=>e.type!=='button'&&e.type!=='submit');
   fields.forEach((el,j)=>{if(Object.prototype.hasOwnProperty.call(answers,j)){
    if(el.type==='checkbox'||el.type==='radio')el.checked=(answers[j]===true||answers[j]==='true');else if(answers[j]!==false&&answers[j]!==true&&answers[j]!==null&&answers[j]!==undefined&&String(answers[j]).toLowerCase()!=='false'&&String(answers[j]).toLowerCase()!=='true')el.value=answers[j];
   }});
   applyShared(doc);cleanFalseBlankFields(doc);fitLongAnswers(doc);
   let signatures={};try{signatures=JSON.parse(localStorage.getItem('mcs_hvrp_canvas_v1_'+originalPageNumber(i))||'{}')}catch(e){}
   let shared={};try{shared=JSON.parse(localStorage.getItem('mcs_hvrp_shared_identity_v2')||'{}')}catch(e){}
   const signaturePromises=[];
   doc.querySelectorAll('canvas').forEach((c,j)=>{
    const key=/staff/i.test(c.id)?'housingVerificationStaffSignature':'participantSignature';
    const data=signatures[j]||shared[key];
    if(data){signaturePromises.push(new Promise(resolve=>{
     const im=new Image();im.onload=()=>{try{c.getContext('2d').drawImage(im,0,0,c.width,c.height)}catch(e){}resolve()};
     im.onerror=resolve;im.src=data;
    }))}
   });
   await Promise.all(signaturePromises);
   // Dense intake sheets: tighten unused vertical spacing before rasterization.
   // This affects only the PDF export iframe, never the live form or saved data.
   if([3,4,5,6,9,10].includes(i)){
    const compact=doc.createElement('style');
    compact.textContent=`
      .paper{min-height:0!important;height:auto!important;padding-top:24px!important;padding-bottom:24px!important}
      p{margin-top:3px!important;margin-bottom:3px!important;line-height:1.18!important}
      h1,h2,h3,h4{margin-top:7px!important;margin-bottom:4px!important;line-height:1.15!important}
      table{border-spacing:0!important}
      td,th{padding-top:1px!important;padding-bottom:1px!important;line-height:1.12!important}
      label{line-height:1.12!important}
      textarea{min-height:20px!important}
    `;
    doc.head.appendChild(compact);
   }
   if(i===18){const tight=doc.createElement("style");tight.textContent=".paper{min-height:0!important;height:auto!important;padding:20px!important}.compact-row{min-height:19px!important;font-size:10px!important}.compact-statement{padding:2px!important}.compact-heading{margin:4px 0 1px!important;padding:3px!important}";doc.head.appendChild(tight);}
   if(i===17){
    const matched=doc.createElement('style');
    matched.textContent='.paper{min-height:0!important;height:auto!important;padding-top:30px!important;padding-bottom:30px!important}';
    doc.head.appendChild(matched);
   }
   fitLongAnswers(doc);
   const paper=doc.querySelector('.paper')||doc.querySelector('main')||doc.body;
   // Ignore review toolbar and page shadow, but preserve original form styling.
   paper.style.boxShadow='none';paper.style.margin='0';
   paper.style.background='#fff';
   // html2canvas renders the visible filled input controls, not their empty HTML attributes.
   await new Promise(resolve=>setTimeout(resolve,80));
   const canvas=await window.html2canvas(paper,{backgroundColor:'#ffffff',scale:1.35,useCORS:true,logging:false,
    windowWidth:1000,windowHeight:1600,scrollX:0,scrollY:0});
   if(i>1)pdf.addPage('letter','portrait');
   // Trim the oversized blank margins that made several intake pages tiny.
   // Detect actual ink/form borders while preserving the whole content block.
   const ctx=canvas.getContext('2d',{willReadFrequently:true});
   const cw=canvas.width,ch=canvas.height;
   const pixels=ctx.getImageData(0,0,cw,ch).data;
   let xMin=cw,yMin=ch,xMax=-1,yMax=-1;
   const step=2;
   for(let y=0;y<ch;y+=step){
    for(let x=0;x<cw;x+=step){
     const k=(y*cw+x)*4;
     // White or nearly-white background is not meaningful form content.
     if(pixels[k]<226||pixels[k+1]<226||pixels[k+2]<226){
      if(x<xMin)xMin=x;if(x>xMax)xMax=x;
      if(y<yMin)yMin=y;if(y>yMax)yMax=y;
     }
    }
   }
   let exportCanvas=canvas;
   if(xMax>=xMin&&yMax>=yMin){
    const marginPx=16;
    const left=Math.max(0,xMin-marginPx),top=Math.max(0,yMin-marginPx);
    const right=Math.min(cw,xMax+marginPx+step),bottom=Math.min(ch,yMax+marginPx+step);
    exportCanvas=doc.createElement('canvas');
    exportCanvas.width=right-left;exportCanvas.height=bottom-top;
    exportCanvas.getContext('2d').drawImage(canvas,left,top,right-left,bottom-top,0,0,right-left,bottom-top);
   }
   // Standardize the visible form width on US Letter pages, as on the
   // Eligibility Determination example. Do not stretch short forms to fill
   // the sheet or let dense forms spill onto a second page.
   const targetW=(i===17)?520:500, maxH=732, topMargin=30;
   // Maximize the printed width on dense pages. A mild horizontal expansion
   // improves legibility without letting the page overflow vertically.
   const ratio=Math.min(targetW/exportCanvas.width,maxH/exportCanvas.height);
   let w=exportCanvas.width*ratio,h=exportCanvas.height*ratio;
   if([3,4,5,6,9,10].includes(i) && w<targetW*0.92){
    w=Math.min(targetW,w*1.42);
   }
   const pdfY=(i===1)?Math.max(30,(792-h)/2):topMargin;
   pdf.addImage(exportCanvas.toDataURL('image/jpeg',0.9),'JPEG',(612-w)/2,pdfY,w,h,undefined,'FAST');
   await new Promise(resolve=>setTimeout(resolve,0));
  }
  if(pdf.getNumberOfPages()!==29)throw new Error('PDF page count was not 29');
  const filename='MCS_HVRP_Completed_Intake_29_Pages.pdf';
  const blob=pdf.output('blob');
  const url=URL.createObjectURL(blob);
  const link=document.createElement('a');link.href=url;link.download=filename;document.body.appendChild(link);link.click();link.remove();
  // iPhone Safari may open the PDF in a new viewer instead of saving automatically.
  setTimeout(()=>URL.revokeObjectURL(url),120000);
  alert('29-page PDF generated. Use your browser download/share options to save or print it. Check that answers and signatures appear before sharing.');
 }catch(e){console.error(e);alert('PDF export failed: '+e.message+'\nNo intake data was submitted.');}
 finally{if(renderFrame)renderFrame.remove();pdfButton.disabled=false;pdfButton.textContent='Download / Print PDF';}
}
pdfButton.onclick=pdfExport;
document.getElementById('submit').onclick=()=>alert('Secure electronic submission is not connected yet. Your intake has NOT been sent to MCS. Use Download / Print PDF, choose Save as PDF in your device’s print menu, then send the PDF only through an MCS-approved secure method. Do not email sensitive veteran information through ordinary unsecured email.');
